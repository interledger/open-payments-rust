[advisories]
yanked = "warn"
unmaintained = "all"
ignore = [
    # dotenv is used only for local/test env loading.
    "RUSTSEC-2021-0141",
    # paste is a transitive proc-macro dependency.
    "RUSTSEC-2024-0436",
]

[licenses]
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Zlib",
    "OpenSSL",
]
confidence-threshold = 0.92

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
